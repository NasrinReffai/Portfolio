<html>
<head>
 <style>
  body {
    background: linear-gradient(135deg, #0f2027, #2c5364);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container { 
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 320px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  input { 
    width: 80%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14px;
  }

    button { 
    padding: 10px 20px;
    background-color: #2c5364;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
  }

    button:hover {  
    background-color: #1a2f3a;
   } 

   ul { 
    list-style:none;
    padding: 0;
    margin-top: 15px;
  } 

  li { 
    background: #f1f1f1;
    margin: 5px 0;
    padding: 10px;
    border-radius: 6px;
    text-align: left;
   } 
</style>

</head>
<body style="background-color: darkcyan;"">
<div class="container">
  <input type="text" id="userInput" placeholder="Type something...">
  <button onclick="addInputToArray()" class="btn" >Add to List</button>
  <p id="errorMsg" style="color:red;"></p>
<ul id="itemList"></ul>
</div>

<script>
  let taskList = [];
  function addInputToArray() {
    const inputField=document.getElementById("userInput");
    const val = inputField.value;
    const error = document.getElementById("errorMsg");

    if (val !== "") {
      // Push the value from the input field into the array
      taskList.push(val);

      inputField.value = "";
      error.innerHTML = "";
      updateUI();
    } 
      // Clear the input field for the next entry
    else{
      error.innerHTML="please enter something";
      
    }
    
  }

  function updateUI() {
    const listElement = document.getElementById("itemList");
    // Refresh the list display
    listElement.innerHTML = taskList.map(item => `<li>${item}</li>`).join('');
  }
</script>
</body>
</html>
